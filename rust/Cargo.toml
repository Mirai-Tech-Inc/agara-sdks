[workspace]

[package]
name = "agara-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Rust client for the agara prediction-markets trading API."
repository = "https://github.com/Mirai-Tech-Inc/prediction-markets"
readme = "README.md"

[features]
default = ["signing", "streaming"]
signing = ["dep:alloy"]
streaming = ["dep:tokio-tungstenite", "dep:futures-util"]

[lib]
name = "agara_sdk"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
thiserror = "2"
bon = "3"
alloy = { version = "1", default-features = false, features = ["std", "signer-local", "sol-types"], optional = true }
rand = "0.9"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rust_decimal_macros = "1"

[project]
name = "agara-sdk"
version = "0.11.0"
description = "Python client for the agara prediction-markets trading API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agara" }]
keywords = ["prediction-markets", "trading", "agara"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests >= 2.31",
    "typing-extensions >= 4.12",
]

[project.optional-dependencies]
streaming = [
    "websockets >= 14",
]
signing = [
    "eth-account >= 0.13",
    "eth-abi >= 5",
    "eth-utils >= 5",
]
async = [
    "httpx >= 0.27",
]
dev = [
    "pytest >= 7",
    "ruff >= 0.12",
    "mypy >= 1.15",
    "types-requests >= 2.31",
    "build >= 1.2",
    "pytest-asyncio >= 0.23",
    "responses >= 0.25",
    "websockets >= 14",
    "eth-account >= 0.13",
    "eth-abi >= 5",
    "eth-utils >= 5",
    "httpx >= 0.27",
]

[project.urls]
Documentation = "https://app.sandbox.agara.xyz/docs"
Repository = "https://github.com/Mirai-Tech-Inc/agara-sdks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agara_sdk"]
[tool.hatch.build.targets.wheel.force-include]
"agara_sdk/py.typed" = "agara_sdk/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "agara_sdk/",
    "README.md",
    "LICENSE",
    "contracts/",
    "tools/",
    "tests/",
    "examples/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
files = ["agara_sdk"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["eth_account.*", "eth_abi.*", "eth_utils.*"]
ignore_missing_imports = true

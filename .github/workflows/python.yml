name: python sdk
on:
  push:
    paths: ['python/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['python/**', '.github/workflows/python.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python tools/generate_async.py --check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy agara_sdk examples
      - run: pytest -q
      - run: python -m build
      - run: |
          python -m venv /tmp/agara-wheel
          /tmp/agara-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/agara-wheel/bin/python -c 'from agara_sdk import AgaraClient, to_micro; assert to_micro("0.1") == 100000'
